---
# - name: Reload systemd cache
#   ansible.builtin.systemd_service:
#     daemon_reload: true
#   timeout: 60
#   ignore_errors: true
- name: Unmask hostapd
  ansible.builtin.systemd:
    name: hostapd
    masked: no

- name: Restart hostapd
  ansible.builtin.systemd_service:
    name: hostapd
    state: restarted
    enabled: true
  become: true

- name: Restart dnsmasq
  ansible.builtin.systemd_service:
    name: dnsmasq
    state: restarted
    enabled: true
  become: true

- name: Restart Outpost
  ansible.builtin.systemd_service:
    name: outpost
    state: restarted
    enabled: true
  become: true