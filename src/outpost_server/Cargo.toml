[package]
name = "outpost_server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
clap = { version ="4.6.5", features = ["derive"] }
config = { path = "../config" }
env_logger = "0.11.11"
log = "0.4.33"
serialport = "4.9.0"
thiserror = "2.0.19"
meshtastic = "0.1.9"
tokio-serial = "5.5.0"
chrono = { version = "0.4.45", features = ["serde"] }
prost = "0.14.4"
arc = "0.0.1"
sqlx = { version = "0.9.0", features = ["sqlite", "chrono", "runtime-tokio", "tls-rustls"] }
serde_json = "1.0.151"
