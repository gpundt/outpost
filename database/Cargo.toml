[package]
name = "database"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
env_logger = "0.11.11"
log = "0.4.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["sqlite", "chrono", "runtime-tokio", "tls-rustls"] }
